.export-doc-table th {
  font-family: var(--font-sans);
  font-size: 9.5px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #5a6470;
  border-bottom: 2px solid #18222e;
}
.export-doc-table .font-mono { color: #845f27; }
.priv-log-table { font-size: 10.5px; }
.priv-log-table th, .priv-log-table td { padding: 6px 7px; }
.export-doc-foot {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid rgba(24,34,46,0.08);
  font-size: 10.5px;
  color: #5a6470;
  font-style: italic;
  line-height: 1.5;
}

/* ═══════════════════════════════════════════════════════════════
 * COMMAND PALETTE
 * ═══════════════════════════════════════════════════════════════ */
.cmdk-shroud {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display: grid; place-items: start center;
  padding-top: 14vh;
  z-index: 200;
  animation: cinematic-in .15s ease-out;
}
.cmdk-panel {
  width: min(640px, 92vw);
  max-height: 70vh;
  background: rgba(13, 22, 34, 0.98);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--brass);
  border-radius: 14px;
  box-shadow: 0 32px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(202,160,92,0.18);
  display: flex; flex-direction: column;
  overflow: hidden;
  color: var(--ink);
}
body[data-theme="light"] .cmdk-panel {
  background: rgba(251,248,241,0.98);
  color: #18222e;
}
.cmdk-input-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,0.03);
}
body[data-theme="light"] .cmdk-input-row { background: rgba(0,0,0,0.02); }
.cmdk-prompt {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  color: var(--brass);
  background: var(--brass-wash);
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}
.cmdk-input {
  flex: 1;
  background: transparent; border: 0;
  font: inherit; font-size: 16px;
  color: inherit;
  outline: none;
}
.cmdk-esc {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-faint);
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--line);
  padding: 2px 7px;
  border-radius: 4px;
}
.cmdk-list { flex: 1; overflow-y: auto; padding: 6px; }
.cmdk-group { margin-bottom: 4px; }
.cmdk-group-head {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--ink-faint);
  text-transform: uppercase;
  padding: 10px 12px 4px;
}
.cmd-row {
  display: grid;
  grid-template-columns: 22px 1fr auto auto;
  gap: 12px;
  align-items: center;
  width: 100%; text-align: left;
  background: transparent; border: 0;
  padding: 9px 12px;
  font: inherit; font-size: 13px;
  color: inherit;
  cursor: pointer;
  border-radius: 7px;
}
.cmd-row.on { background: rgba(202,160,92,0.18); }
.cmd-glyph { color: var(--brass); font-size: 13px; }
.cmd-label { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body[data-theme="light"] .cmd-label { color: #18222e; }
.cmd-row.on .cmd-label { color: var(--brass-light); }
body[data-theme="light"] .cmd-row.on .cmd-label { color: var(--brass-deep); }
.cmd-detail {
  font-size: 11px;
  color: var(--ink-faint);
}
.cmd-shortcut {
  font-size: 10px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--line);
  padding: 2px 6px;
  border-radius: 3px;
  color: var(--ink-soft);
}
.cmdk-empty {
  padding: 32px;
  text-align: center;
  font-size: 12px;
  color: var(--ink-faint);
}
.cmdk-foot {
  display: flex; gap: 14px;
  padding: 10px 18px;
  border-top: 1px solid var(--line);
  font-size: 10.5px;
  color: var(--ink-faint);
  background: rgba(255,255,255,0.02);
}
body[data-theme="light"] .cmdk-foot { background: rgba(0,0,0,0.02); }
.cmdk-foot kbd {
  font-family: var(--font-mono);
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--line);
  padding: 1px 5px; border-radius: 3px;
  font-size: 9.5px;
  margin-right: 3px;
}
.cmdk-foot span { display: inline-flex; align-items: center; gap: 4px; }

/* Hot tag mini used in panels */
.hot-tag-mini {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--danger);
  background: var(--danger-wash);
  border: 1px solid rgba(232,114,105,0.3);
  padding: 1px 5px; border-radius: 3px;
}
.priv-tag {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em;
  color: var(--flag); background: var(--flag-wash);
  border: 1px solid rgba(225,162,88,0.4);
  padding: 1px 7px; border-radius: 3px;
}

/* Responsive collapse for Worktop */
@media (max-width: 1280px) {
  .worktop { grid-template-columns: 300px minmax(0, 1fr) 280px; }
}
@media (max-width: 1100px) {
  .worktop { grid-template-columns: minmax(0, 1fr); }
  .worktop-left, .worktop-right { display: none; }
}

</style>
